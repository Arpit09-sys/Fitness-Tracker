<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack - Workout Log</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="logo">Fit<span>Track</span></a>
        <ul class="nav-links">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="progress.html">Progress</a></li>
            <li><a href="workout.html" class="active">Workouts</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><button class="btn-logout" onclick="logout()">Logout</button></li>
        </ul>
    </nav>

    <div class="container">
        <h1 class="page-title">Workout Log</h1>

        <div id="alert-box"></div>

        <!-- Add Workout Form -->
        <div class="card">
            <h3>Add Workout</h3>
            <form id="workout-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Workout Name</label>
                        <input type="text" id="name" placeholder="e.g. Running, Push-ups, Yoga" required>
                    </div>
                    <div class="form-group">
                        <label for="duration">Duration (minutes)</label>
                        <input type="number" id="duration" placeholder="e.g. 30" min="1" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="notes">Notes</label>
                    <textarea id="notes" placeholder="How did it go? Any details..."></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Add Workout</button>
            </form>
        </div>

        <!-- Workout History -->
        <div class="card" style="padding: 0; overflow: hidden;">
            <div style="padding: 20px 24px 0;">
                <h3>Workout History</h3>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Workout</th>
                        <th>Duration (min)</th>
                        <th>Notes</th>
                    </tr>
                </thead>
                <tbody id="workout-table">
                    <tr><td colspan="4" class="text-center text-muted">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <footer class="footer">
        &copy; 2026 FitTrack. Personal Fitness Tracker.
    </footer>

    <script src="js/workout.js"></script>
</body>
</html>
