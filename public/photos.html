<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack - Progress Photos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="logo">Fit<span>Track</span></a>
        <ul class="nav-links">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="progress.html">Progress</a></li>
            <li><a href="workout.html">Workouts</a></li>
            <li><a href="photos.html" class="active">Photos</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><button class="btn-logout" onclick="logout()">Logout</button></li>
        </ul>
    </nav>

    <div class="container">
        <h1 class="page-title">Progress Photos</h1>

        <div id="alert-box"></div>

        <!-- Upload Form -->
        <div class="card">
            <h3>Upload New Photos</h3>
            <form id="photo-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="frontPhoto">Front Photo</label>
                        <input type="file" id="frontPhoto" accept="image/jpeg,image/png,image/jpg">
                    </div>
                    <div class="form-group">
                        <label for="sidePhoto">Side Photo</label>
                        <input type="file" id="sidePhoto" accept="image/jpeg,image/png,image/jpg">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Upload Photos</button>
            </form>
        </div>

        <!-- Photo Gallery -->
        <div id="photo-gallery">
            <div class="empty-state">
                <p>No photos uploaded yet.</p>
            </div>
        </div>
    </div>

    <footer class="footer">
        &copy; 2026 FitTrack. Personal Fitness Tracker.
    </footer>

    <script src="js/photos.js"></script>
</body>
</html>
