<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack - Progress Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="logo">Fit<span>Track</span></a>
        <ul class="nav-links">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="progress.html" class="active">Progress</a></li>
            <li><a href="workout.html">Workouts</a></li>
            <li><a href="photos.html">Photos</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><button class="btn-logout" onclick="logout()">Logout</button></li>
        </ul>
    </nav>

    <div class="container">
        <h1 class="page-title">Progress Tracker</h1>

        <div id="alert-box"></div>

        <!-- Add/Edit Progress Form -->
        <div class="card">
            <h3 id="form-title">Add Daily Progress</h3>
            <form id="progress-form">
                <input type="hidden" id="edit-id">
                <div class="form-row">
                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" required>
                    </div>
                    <div class="form-group">
                        <label for="weight">Weight (kg)</label>
                        <input type="number" id="weight" step="0.1" placeholder="e.g. 70.5" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="waterIntake">Water Intake (ml)</label>
                        <input type="number" id="waterIntake" placeholder="e.g. 2000" min="0">
                    </div>
                    <div class="form-group">
                        <label for="workoutCompleted">Workout Completed?</label>
                        <select id="workoutCompleted">
                            <option value="false">No</option>
                            <option value="true">Yes</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="notes">Notes</label>
                    <textarea id="notes" placeholder="How was your day? Any observations..."></textarea>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="btn btn-primary" id="submit-btn">Add Entry</button>
                    <button type="button" class="btn btn-danger hidden" id="cancel-btn" onclick="cancelEdit()">Cancel</button>
                </div>
            </form>
        </div>

        <!-- Progress History Table -->
        <div class="card" style="padding: 0; overflow: hidden;">
            <div style="padding: 20px 24px 0;">
                <h3>Progress History</h3>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Weight (kg)</th>
                        <th>Workout</th>
                        <th>Water (ml)</th>
                        <th>Notes</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="progress-table">
                    <tr><td colspan="6" class="text-center text-muted">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <footer class="footer">
        &copy; 2026 FitTrack. Personal Fitness Tracker.
    </footer>

    <script src="js/progress.js"></script>
</body>
</html>
