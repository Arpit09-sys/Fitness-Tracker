<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack - My Profile</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="logo">Fit<span>Track</span></a>
        <ul class="nav-links">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="progress.html">Progress</a></li>
            <li><a href="workout.html">Workouts</a></li>
            <li><a href="photos.html">Photos</a></li>
            <li><a href="profile.html" class="active">Profile</a></li>
            <li><button class="btn-logout" onclick="logout()">Logout</button></li>
        </ul>
    </nav>

    <div class="container">
        <h1 class="page-title">My Profile</h1>

        <div id="alert-box"></div>

        <div class="card">
            <form id="profile-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" disabled>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="age">Age</label>
                        <input type="number" id="age" min="10" max="100">
                    </div>
                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <select id="gender">
                            <option value="">Select</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="height">Height (cm)</label>
                        <input type="number" id="height" min="50" max="300">
                    </div>
                    <div class="form-group">
                        <label for="weight">Weight (kg)</label>
                        <input type="number" id="weight" min="20" max="500">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="activityLevel">Activity Level</label>
                        <select id="activityLevel">
                            <option value="sedentary">Sedentary</option>
                            <option value="light">Light</option>
                            <option value="moderate">Moderate</option>
                            <option value="active">Active</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="goal">Fitness Goal</label>
                        <select id="goal">
                            <option value="maintain">Maintain Weight</option>
                            <option value="lose">Lose Weight</option>
                            <option value="gain">Gain Muscle</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary mt-2">Update Profile</button>
            </form>
        </div>
    </div>

    <footer class="footer">
        &copy; 2026 FitTrack. Personal Fitness Tracker.
    </footer>

    <script src="js/profile.js"></script>
</body>
</html>
